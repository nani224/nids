<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

  <div class="page-header mb-4">
    <h2><i class="bi bi-funnel me-2"></i>Intrusion Rules</h2>
  </div>

  <div class="row g-4">
    <!-- Form -->
    <div class="col-md-4">
      <div class="card nids-card">
        <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Add Rule</div>
        <div class="card-body">
          <form th:action="@{/rules}" method="post" th:object="${rule}">
            <div class="mb-3">
              <label class="form-label">Rule Name</label>
              <input type="text" class="form-control" th:field="*{ruleName}" required placeholder="e.g. Port Scan"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Protocol</label>
              <select class="form-select" th:field="*{protocol}">
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
                <option value="ICMP">ICMP</option>
                <option value="ANY">ANY</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Port (leave empty for any)</label>
              <input type="number" class="form-control" th:field="*{port}" placeholder="e.g. 80"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Packet Threshold</label>
              <input type="number" class="form-control" th:field="*{threshold}" required placeholder="e.g. 100"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Severity</label>
              <select class="form-select" th:field="*{severity}">
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
              </select>
            </div>
            <button type="submit" class="btn btn-danger w-100">
              <i class="bi bi-save me-1"></i>Save Rule
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="col-md-8">
      <div class="card nids-card">
        <div class="card-header"><i class="bi bi-table me-2"></i>INTRUSION_RULE Table</div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead>
              <tr><th>ID</th><th>Rule Name</th><th>Protocol</th><th>Port</th><th>Threshold</th><th>Severity</th></tr>
            </thead>
            <tbody>
              <tr th:each="r : ${rules}">
                <td th:text="${r.ruleId}"></td>
                <td th:text="${r.ruleName}"></td>
                <td><span class="badge bg-primary" th:text="${r.protocol}"></span></td>
                <td th:text="${r.port != null ? r.port : 'ANY'}"></td>
                <td th:text="${r.threshold}"></td>
                <td>
                  <span class="badge"
                        th:classappend="${r.severity.name() == 'HIGH'} ? 'bg-danger' :
                                        (${r.severity.name() == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                        th:text="${r.severity}"></span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(rules)}">
                <td colspan="6" class="text-center text-muted py-3">No rules defined yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
