<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">

  <div class="page-header mb-4">
    <h2><i class="bi bi-hdd-network me-2"></i>Network Devices</h2>
  </div>

  <div class="row g-4">
    <!-- Form -->
    <div class="col-md-4">
      <div class="card nids-card">
        <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Register Device</div>
        <div class="card-body">
          <form th:action="@{/devices}" method="post" th:object="${device}">
            <div class="mb-3">
              <label class="form-label">Device Name</label>
              <input type="text" class="form-control" th:field="*{deviceName}" required placeholder="e.g. Web-Server-01"/>
            </div>
            <div class="mb-3">
              <label class="form-label">IP Address</label>
              <input type="text" class="form-control" th:field="*{ipAddress}" required placeholder="e.g. 192.168.1.10"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Device Type</label>
              <select class="form-select" th:field="*{deviceType}">
                <option value="PC">PC</option>
                <option value="Router">Router</option>
                <option value="Server">Server</option>
                <option value="Switch">Switch</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" th:field="*{location}" placeholder="e.g. Server Room"/>
            </div>
            <button type="submit" class="btn btn-danger w-100">
              <i class="bi bi-save me-1"></i>Register
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="col-md-8">
      <div class="card nids-card">
        <div class="card-header"><i class="bi bi-table me-2"></i>NETWORK_DEVICE Table</div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead>
              <tr><th>ID</th><th>Name</th><th>IP Address</th><th>Type</th><th>Location</th></tr>
            </thead>
            <tbody>
              <tr th:each="d : ${devices}">
                <td th:text="${d.deviceId}"></td>
                <td th:text="${d.deviceName}"></td>
                <td><code th:text="${d.ipAddress}"></code></td>
                <td><span class="badge bg-secondary" th:text="${d.deviceType}"></span></td>
                <td th:text="${d.location}"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(devices)}">
                <td colspan="5" class="text-center text-muted py-3">No devices registered yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
